<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071426" />
  <title>Only</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#071426; color:#f8fafc; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; }
    main { width:min(100%, 440px); text-align:center; }
    img { width:76px; height:76px; border-radius:20px; object-fit:cover; }
    h1 { margin:12px 0 4px; font-size:24px; }
    p { color:#cbd5e1; line-height:1.55; }
    button { width:100%; min-height:48px; margin-top:14px; padding:12px 16px; border:0; border-radius:14px; background:#3CACFD; color:#071426; font-weight:700; font-size:16px; }
    #state { min-height:48px; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <img src="./only-brand-logo.png" alt="Only" />
    <h1>Only</h1>
    <p>Kết nối với bạn bè quanh bạn và tìm chuyến đi phù hợp.</p>
    <p id="state" role="status" aria-live="polite">Đang mở Only…</p>
    <button id="open" type="button" hidden>Mở Only</button>
  </main>
  <script>
    (function () {
      var APP_URL = "https://only-social-network.onrender.com/";
      var state = document.getElementById('state');
      var button = document.getElementById('open');
      button.addEventListener('click', function () { window.location.assign(APP_URL); });
      try {
        if (window.zmp && typeof window.zmp.openWebview === 'function') {
          window.zmp.openWebview({ url: APP_URL });
          state.textContent = 'Đang mở Only trong Zalo…';
          setTimeout(function () { state.textContent = 'Nếu trang chưa mở, nhấn nút bên dưới.'; button.hidden = false; }, 1800);
        } else {
          state.textContent = 'Mở phiên bản Only trên web.';
          button.hidden = false;
        }
      } catch (e) {
        state.textContent = 'Nhấn nút để mở Only.';
        button.hidden = false;
      }
    })();
  </script>
</body>
</html>
